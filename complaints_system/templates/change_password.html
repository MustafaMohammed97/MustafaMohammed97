{% extends "base.html" %}
{% block title %}تغيير كلمة المرور{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>تغيير كلمة المرور</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>كلمة المرور الحالية <input name="current_password" type="password" required></label>
    <label>كلمة المرور الجديدة <input name="new_password" type="password" minlength="6" required></label>
    <label>تأكيد كلمة المرور الجديدة <input name="confirm_password" type="password" minlength="6" required></label>
    <div class="form-actions"><button class="btn btn-primary">حفظ</button></div>
  </form>
</div>
{% endblock %}
